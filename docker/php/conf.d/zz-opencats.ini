; OpenCATS on PHP 8.4: the vendored artichow charting library emits many
; E_DEPRECATED notices that would otherwise render on top of every page.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
