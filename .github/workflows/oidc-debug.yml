# Temporary: prints the OIDC token claims so we can see what AWS is actually
# being handed. Delete once the deploy role trust policy is confirmed working.
name: OIDC debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC token claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "--- header ---"
          echo "$TOKEN" | cut -d. -f1 | tr '_-' '/+' | base64 -d 2>/dev/null | jq . || true
          echo "--- payload ---"
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss,aud,sub,repository,repository_owner,ref,event_name}' || true

      - name: Who does AWS think we are
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::246814138703:role/wtf-opencats-deploy
          aws-region: ap-south-1
